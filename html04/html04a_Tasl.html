<!DOCTYPE html>

<body>


   <h1>Nature</h1>
   <p>Practice adding image with alt text, caption, and sizing.</p>

   <section id="gallery">
    <h2>Product Gallery</h2>
    
    <figure>
        <img src="images/nature-scene-1.jpg" alt="A scenic mmntain landscape with clear blue sky" width="300" height="200">
        <figcaption>A scenic mmntain landscape with clear blue sky</figcaption>
    </figure>

    
    <figure>
        <img src="images/nature-scene-2.jpg" alt="Forest path lined with tall evergreen tress" width="300" height="200">
        <figcaption>Forest path line with all evergreen trees</figcaption>
    
    </figure>
   </section>


   <section id="figure">
    <h2>Figures with Captions</h2>
     <p>Use <code>&lt;figure&gt;</code> and <code>&lt;figcaption&gt;</code> for semantic image structure.</p>
