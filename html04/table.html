<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        table, th, td { border: 3px solid hsl(0, 40%, 23%); border-collapse: collapse; }
        th, td { padding: 30px}
        th {background-color: rgb(250, 235, 215);}
    </style>
    
</head>
<body>
<h1>Lunch Menu</h1>
<table>
    <caption>Weekly Lunch Menu</caption>
    <tr>
        <th>Day</th>
        <th>Main</th>
        <th>Side</th>
    </tr>
    <tr>
        <td>Monday</td>
        <td>Mexican</td>
        <td>Chips</td>
    </tr>
    <tr>
        <td>Tuesday</td>
        <td>Steak</td>
        <td>Corn</td>
    </tr>
    <tr>
        <td>Friday</td>
        <td colspan="2"> No School-Holiday</td>
    </tr>
</table>
</body>
</html>
